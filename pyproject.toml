[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-analyzer-cli"
dynamic = ["version"]
description = "Movie Review Sentiment Analysis CLI"
readme = "README.md"
authors = [{ name = "AP-Abhishek" }]
dependencies = [
    "pandas",
    "scikit-learn",
    "joblib"
]

[tool.setuptools.dynamic]
version = {attr = "src.__version__"}

[project.scripts]
sentiment-analyzer-cli = "main:main"
